name: Build and publish Real Effects

on:
  workflow_dispatch:
    inputs:
      collection:
        description: Directory under effect-assets (for example remote-v6)
        required: true
        type: string
      publish:
        description: Publish after reviewing the build and distributing the catalog-compatible app
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: real-effects-publication
  cancel-in-progress: false

jobs:
  effects:
    if: github.repository == 'kedarmayekar/gif-packs'
    runs-on: ubuntu-latest
    env:
      COLLECTION: ${{ inputs.collection }}
      EFFECT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<14'
      - name: Test publishing tools
        run: python -m unittest discover -s tools -p 'test_effect_pack*.py'
      - name: Build and verify
        run: |
          python tools/build_effect_packs.py --repository "$EFFECT_REPOSITORY" --collection "$COLLECTION"
          python tools/verify_effect_packs.py --repository "$EFFECT_REPOSITORY" --collection "$COLLECTION"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-real-effects
          path: |
            effect-assets/*/hosting/
            effect-assets/*/releases/
            effect-assets/*/*preview.jpg
      - name: Publish immutable release and catalog
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_effect_packs.py --repository "$EFFECT_REPOSITORY" --collection "$COLLECTION"
          python tools/verify_effect_packs.py --repository "$EFFECT_REPOSITORY" --collection "$COLLECTION" --live
